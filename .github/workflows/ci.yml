#
# Tests run against PostgreSQL 16, as production does: the database enforces
# rules the application relies on (ADR 0002), so SQLite would hide failures.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: openric_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: openric_workspace_test
      DB_USERNAME: workspace
      DB_PASSWORD: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, mbstring, xmlreader, dom, imagick, gd, fileinfo
          coverage: none
      # pdftoppm makes the copies of a PDF's first page (App\Files\FileStore).
      - name: PDF tools
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Application key
        run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test
