# Copyright (C) 2026 Johan Pieterse / Plain Sailing Information Systems
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Tests run against PostgreSQL 16, as production does: the database enforces
# rules the application relies on (ADR 0002), so SQLite would hide failures.

name: CI

# A release tag points at a commit whose tests have passed on main: it is checked for that, and for its signature,
# rather than tested again (Dr Johan Pieterse's choice 3 of 3 November 2026).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on PostgreSQL 16
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 16 with pgvector, for search by meaning (phase 17d1); the version this host runs.
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: openric_workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: openric_workspace_test
      DB_USERNAME: workspace
      DB_PASSWORD: workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, mbstring, xmlreader, dom, imagick, gd, fileinfo, zip
          coverage: none
      # convert (ImageMagick) makes the viewing copies and watermarks them, in DejaVu Sans; pdftoppm draws a PDF's first page
      # and pdftotext reads its text (App\Files\FileStore, PdfText, Watermark); exiftool reads embedded metadata (EmbeddedMetadata);
      # ffprobe reads the length of sound and video (MediaDuration).
      - name: Image and PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick poppler-utils libimage-exiftool-perl ffmpeg fonts-dejavu-core tesseract-ocr
      # SHACL is the gate (Governance profile 5, ADR 0013): tests/Feature/ShaclGateTest checks every kind of published RiC-O
      # against the pinned OpenRiC shapes with pySHACL, and fails here rather than skip if it is missing.
      - name: SHACL validator
        run: pipx install pyshacl==0.30.1
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Application key
        run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: pgvector in the test database
        run: PGPASSWORD=workspace psql -h 127.0.0.1 -U workspace -d openric_workspace_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Tests
        run: php artisan test
        env:
          SHACL_REQUIRED: '1'

  release-tag:
    name: The tag is signed and its commit passed on main
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Signature and tests
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "tag") | .sha')
          [ -n "$tag" ] || { echo "$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
          [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .verification.verified)" = true ] || { echo "$GITHUB_REF_NAME is not signed by a verified key"; exit 1; }
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .object.sha)
          # GitHub's list filtered by status as well as commit can miss a run that passed (v0.0.117): filter it here instead.
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit" --jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "CI has not passed on main for $commit"; exit 1; }
          echo "$GITHUB_REF_NAME: signed, and $commit passed on main"

  # Roadmap phase 23 (hardening): known vulnerabilities in the locked dependencies, secrets anywhere in the history,
  # and a software bill of materials kept with every run, so each release tag has its own.
  security:
    name: Dependencies, secrets and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Known vulnerabilities (composer audit)
        run: composer audit --locked --no-interaction
      - name: Secrets in the history (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
      - name: Software bill of materials (CycloneDX)
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
