; OpenRiC Workspace - what runs in the container: php-fpm, nginx, the scheduler, and a queue worker for both queues.
; In a container the files worker cannot be cut off from the network as its systemd unit is on a server
; (INSTALL.md step 8), so one worker runs the default and files queues; WORKSPACE_FILES_WORKER stays false.
; Copyright (C) 2026 Johan Pieterse / Plain Sailing Information Systems
; SPDX-License-Identifier: AGPL-3.0-or-later
[supervisord]
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/bin/php8.3 /var/www/openric-workspace/artisan schedule:work
user=www-data
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/bin/php8.3 /var/www/openric-workspace/artisan queue:work --queue=default,files --tries=1 --timeout=7200 --max-time=3600 --sleep=5
user=www-data
autorestart=true
priority=40
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
